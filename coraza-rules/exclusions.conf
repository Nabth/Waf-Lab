# Исключение для Juice Shop Socket.IO (устраняет FP)
# Мы убираем проверку заголовка Content-Type (TX:content_type) 
# из правила 920420, но ТОЛЬКО для запросов, начинающихся с /socket.io/
SecRule REQUEST_URI "@beginsWith /socket.io/" \
    "id:1001,phase:1,pass,nolog,msg:'FP exemption for Juice Shop Socket.IO',\
    ctl:ruleRemoveTargetById=920420;TX:content_type"
# Исключение для Juice Shop /rest/user/whoami (устраняет FP RCE)
# Убираем проверку REQUEST_FILENAME из правила 932260 (RCE) для этого эндпоинта
SecRule REQUEST_URI "@beginsWith /rest/user/whoami" \
    "id:1002,phase:1,pass,nolog,msg:'FP exemption for Juice Shop whoami endpoint',\
    ctl:ruleRemoveTargetById=932260;REQUEST_FILENAME"
